site_name: VeriLib Documentation
site_url: https://docs.verilib.org
site_description: Documentation for VeriLib — the open-source library for formally verified code.
copyright: Copyright &copy; Beneficial AI Foundation

repo_url: https://github.com/Beneficial-AI-Foundation/engineering-docs
repo_name: Beneficial-AI-Foundation/engineering-docs
edit_uri: edit/main/docs/

exclude_docs: |
  internal/

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: en
  logo: assets/logo-mark.svg
  favicon: assets/logo-mark.svg
  font:
    text: Inter
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

