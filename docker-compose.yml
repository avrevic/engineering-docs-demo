services:
  mkdocs-dev:
    profiles: [dev]
    image: python:3.12-slim
    working_dir: /docs
    volumes:
      - .:/docs
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install -q -r requirements.txt &&
             mkdocs serve -f mkdocs-internal.yml --dev-addr=0.0.0.0:8000"

  mkdocs-public:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MKDOCS_CONFIG: mkdocs.yml
    ports:
      - "8080:80"

  mkdocs-internal-nginx:
    profiles: [internal]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MKDOCS_CONFIG: mkdocs-internal.yml
    expose:
      - "80"

  oauth2-proxy:
    profiles: [internal]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.11.0
    depends_on:
      - mkdocs-internal-nginx
    ports:
      - "4180:4180"
    env_file:
      - path: oauth2-proxy/.env
        required: false
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://mkdocs-internal-nginx:80
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
    volumes:
      - ./oauth2-proxy/allowed-emails.txt:/etc/oauth2-proxy/allowed-emails.txt:ro
